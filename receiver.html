<!DOCTYPE html>
<html>
<head>
  <style>
    * { margin: 0; padding: 0; background: #000; overflow: hidden; }
    #player, iframe, html, body { width: 100vw; height: 100vh; }
    .receiver_pagee_player { height: 200vh !important; margin-top: -50vh; }
  </style>
</head>
<body>
  <div id="player"></div>
  <script>
    let player = null;
    let polling = null;

    function toParent(data) {
      window.parent.postMessage(data, '*');
    }

    // Escuta os comandos vindos do arquivo pai (Pagee)
    window.addEventListener('message', (e) => {
      if (e.data.eval) {
        try { 
          eval(e.data.eval); 
          
          // ⚡ INTERCEPTADOR DE FALLBACK: Se um iframe de fallback foi injetado, amarramos a API nele
          const fallbackIframe = document.querySelector('div iframe');
          if (fallbackIframe && player) {
             // Quando o usuário interagir com o de cima, forçamos o play no de baixo (Start no timeupdate)
             fallbackIframe.addEventListener('click', () => {
                 if (player.getPlayerState() !== 1) {
                     player.playVideo();
                     player.mute();
                 }
             });
          }
        } catch(err) { 
          console.error("Eval Error:", err); 
        }
        return;
      }

      const { action, value } = e.data || {};

      switch (action) {
        case 'init':
          initPlayer(value);
          break;
        case 'play':
          player?.playVideo();
          break;
        case 'pause':
          player?.pauseVideo();
          break;
        case 'seek':
          player?.seekTo(value, true);
          break;
        case 'mute':
          player?.mute();
          break;
        case 'unmute':
          player?.unMute();
          break;
      }
    });

    function initPlayer(videoId) {
      if (player && typeof player.destroy === 'function') {
        player.destroy();
      }

      player = new YT.Player('player', {
        videoId,
        playerVars: { 
          rel: 0, 
          modestbranding: 1, 
          enablejsapi: 1,
          origin: window.location.origin
        },
        events: {
          onReady: (e) => {
            toParent({ event: 'ready', duration: e.target.getDuration() });
          },
          onStateChange: (e) => {
            toParent({ event: 'stateChange', state: e.data });
            
            if (e.data === YT.PlayerState.PLAYING) {
              if (polling) clearInterval(polling);
              polling = setInterval(() => {
                toParent({
                  event: 'timeupdate',
                  currentTime: player.getCurrentTime(),
                  duration: player.getDuration()
                });
              }, 300);
            } else {
              if (polling) clearInterval(polling);
              polling = null;

              if (e.data === YT.PlayerState.ENDED) {
                const total = player.getDuration();
                toParent({ 
                    event: 'timeupdate', 
                    currentTime: total, 
                    duration: total 
                });
              }
            }
          },
          onError: (e) => toParent({ event: 'error', code: e.data })
        }
      });
    }

    // Sempre registra e dispara o barramento da API do YT
    window.onYouTubeIframeAPIReady = function() {
      toParent({ event: 'apiReady' });
    };

    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    const firstScriptTag = document.getElementsByTagName('script')[0];
    if (firstScriptTag) {
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
    } else {
      document.head.appendChild(tag);
    }



    function gee_video_set_quality(itemEl) {
    if (!itemEl) return;
    const elem = itemEl.closest('.gee-video');
    if (!elem) return;

    const quality = itemEl.textContent.trim();
    const btnDef = itemEl.closest('.gee-video-control-def');
    
    if (btnDef) {
        btnDef.setAttribute('data-quality', quality);
    }

    const player = PageePlayerMap.get(elem.id);

    // Mapa de qualidade compartilhado entre receiver e API oficial
    const ytQualityMap = {
        '1080': 'hd1080',
        '720': 'hd720',
        '360': 'medium',
        'auto': 'default'
    };

    // 1. YouTube via Receiver (Iframe Local)
    if (player?.type === 'receiver') {
        const ytQuality = ytQualityMap[quality] || 'default';
        const qualityScript = `if (player && typeof player.setPlaybackQuality === 'function') { player.setPlaybackQuality('${ytQuality}'); }`;
        player.ref.contentWindow.postMessage({ eval: qualityScript }, '*');
    } 
    // 2. ⚡ Wistia via Receiver (Iframe Local)
    else if (player?.type === 'wistia_receiver') {
        const qualityScript = `if(wistiaVideoInstance) { /* Lógica de qualidade Wistia se suportado */ }`;
        player.ref.contentWindow.postMessage({ eval: qualityScript }, '*');
    }
    // 3. ⚡ Wistia Nativo (Produção HTTPS)
    else if (player?.type === 'wistia') {
        // Wistia gerencia nativamente na UI própria ou customizações específicas de bitrate
    }
    // 4. ⚡ Vimeo Nativo (SDK)
    else if (player?.type === 'vimeo') {
        player.ref.setQuality(quality).catch(err => {
            console.error("Pagee: Erro ao alterar qualidade no Vimeo", err);
        });
    }
    // 5. YouTube API Oficial
    else if (player?.type === 'yt') {
        if (player.ref.setPlaybackQuality) {
            player.ref.setPlaybackQuality(ytQualityMap[quality] || 'default');
        }
    } 
    // 6. Fallback: Vídeo Nativo HTML5
    else {
        const video = elem.querySelector('video');
        if (!video) return;
        // Implementar lógica de troca de source se aplicável ao fallback nativo
    }

    // Fecha o menu após a seleção
    const menu = itemEl.closest('.gee-video_subcontrol_menu');
    if (menu) {
        menu.classList.remove('active');
    }
}
  </script>
</body>
</html>
